name: 🐞 Bug Report
description: 앱이나 웹사이트의 오류 또는 예상치 못한 동작을 보고할 때 사용하세요.
title: "[Bug] "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 버그 제보 양식
        아래 내용을 자세히 작성해주시면 빠른 해결에 큰 도움이 됩니다 🙏

  - type: input
    id: environment
    attributes:
      label: 사용 환경
      description: 예) OS, 브라우저, Node.js 버전 등
      placeholder: "예: macOS 14.1 / Chrome 123 / Node.js v18.16"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 구체적으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 단계별로 알려주세요.
    validations:
      required: true
